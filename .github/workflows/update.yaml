name: Check for updates

on:
  schedule:
    - cron: '0 */6 * * *'  # Запуск каждые 6 часов
  workflow_dispatch:      # Возможность ручного запуска из интерфейса GitHub

jobs:
  check-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # Разрешение на запись для коммита и пуша изменений
    outputs:
      committed: ${{ steps.commit_step.outputs.committed }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check and update version
        run: python update_addon.py

      - name: Commit and push changes
        id: commit_step
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Bump addon version due to Docker image update"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes to commit"
            echo "committed=false" >> "$GITHUB_OUTPUT"
          fi

  call-build:
    needs: check-update
    if: needs.check-update.outputs.committed == 'true'
    uses: ./.github/workflows/build.yaml
    permissions:
      contents: read
      packages: write
